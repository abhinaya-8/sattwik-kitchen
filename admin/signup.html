<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Signup | Sattwik Kitchen</title><link rel="stylesheet" href="admin.css"></head>
<body class="login-page"><div class="login-shell"><div class="login-brand"><img src="https://res.cloudinary.com/spfurewl/image/upload/v1789330411/sattwik-logo.png" alt="Sattwik Kitchen logo"><h1>Create Admin Account</h1></div><form id="adminSignupForm" class="login-form"><label>Full Name<input id="adminNameInput" type="text" required autocomplete="name"></label><label>Email<input id="adminEmailInput" type="email" required autocomplete="email"></label><label>Password<input id="adminPasswordInput" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm Password<input id="adminConfirmPasswordInput" type="password" required minlength="8" autocomplete="new-password"></label><button type="submit" class="btn btn-primary">Create account</button><p id="adminSignupMessage" class="form-message" aria-live="polite"></p><a class="auth-link" href="/admin/login.html">Back to admin login</a></form></div><script src="admin.js"></script></body>
</html>
