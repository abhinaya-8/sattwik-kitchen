<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery Signup | Sattwik Kitchen</title><link rel="stylesheet" href="delivery.css"></head>
<body class="delivery-page"><main class="delivery-login"><img src="https://res.cloudinary.com/spfurewl/image/upload/v1789330411/sattwik-logo.png" alt="Sattwik Kitchen"><p class="eyebrow">DELIVERY MEMBER</p><h1>Create account</h1><form id="deliverySignupForm"><label>Full Name<input id="deliverySignupName" type="text" required autocomplete="name"></label><label>Email<input id="deliverySignupEmail" type="email" required autocomplete="email"></label><label>Phone<input id="deliverySignupPhone" type="tel" required autocomplete="tel"></label><label>Password<input id="deliverySignupPassword" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm Password<input id="deliverySignupConfirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><button class="delivery-button" type="submit">Create account</button></form><p id="deliveryMessage" class="message"></p><a href="/delivery/login.html">Back to delivery login</a></main><script src="delivery.js"></script></body>
</html>
